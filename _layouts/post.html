---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">
      Date Published:
      <time datetime="{{ page.date | date_to_xmlschema }}"
        >{{ page.date | date: "%B %-d, %Y" }}</time
      >
    </p>
  </header>
  <hr class="post-divider" />

  <div class="post-content">{{ content }}</div>
</article>
