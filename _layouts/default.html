<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>

    <!-- Invisible Mastodon Verification -->
    <link rel="me" href="https://mastodon.social/@rudraasthana" />

    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/favicon.svg' | relative_url }}"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      const theme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      document.documentElement.setAttribute("data-theme", theme);
    </script>
  </head>
  <body>
    <main>
      <div class="header-nav">
        <button
          onclick="toggleTheme()"
          class="theme-toggle"
          aria-label="Toggle Theme"
        >
          <i data-lucide="sun" class="sun-icon"></i>
          <i data-lucide="moon" class="moon-icon"></i>
        </button>
      </div>

      {{ content }}

      <footer
        style="
          margin-top: 4rem;
          padding-top: 2rem;
          border-top: 1px solid var(--surface0);
          font-size: 0.85em;
          color: var(--subtext0);
          text-align: center;
          line-height: 1.5;
        "
      >
        <p>
          Site infrastructure and code are licensed under
          <a
            href="https://www.gnu.org/licenses/gpl-3.0"
            target="_blank"
            rel="noopener noreferrer"
            >GPLv3</a
          >.
        </p>
        <p>
          All written content and logs are licensed under
          <a
            href="https://creativecommons.org/licenses/by-nc-nd/4.0/"
            target="_blank"
            rel="noopener noreferrer"
            >CC BY-NC-ND 4.0</a
          >.
        </p>
      </footer>
    </main>

    <script>
      lucide.createIcons();
      function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      }
    </script>
  </body>
</html>
